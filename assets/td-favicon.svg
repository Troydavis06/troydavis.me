<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Troy Davis">
  <!-- Drawn geometrically, not with <text>: an SVG favicon renders in an
       isolated document with no access to the page's webfonts, so a text
       glyph would silently fall back to whatever the OS happens to pick.
       Solid fills only, so it reads on a light or dark browser chrome. -->
  <rect width="32" height="32" fill="#bf5700"/>
  <path d="M9 9.5 L15.5 16 L9 22.5" fill="none" stroke="#f4f1ea"
        stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="17.5" y="20" width="7" height="3" fill="#f4f1ea"/>
</svg>
